baseURL = "https://docs.samt-bu.no/"
title = "SAMT-BU Docs"
theme = "hugo-theme-samt-bu"
defaultContentLanguage = "nb"
defaultContentLanguageInSubdir = false
enableGitInfo = true
# Ødelagt relref skal ikke stoppe bygget for alle (solution-samt-bu-docs#83)
refLinksErrorLevel = "WARNING"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[languages]
  [languages.nb]
    languageCode = "nb-NO"
    languageName = "Bokmål"
    title = "SAMT-BU Docs"
    weight = 1
    [languages.nb.params]
      navSwitcherLabel = "Innhold"
      navSwitcherPlaceholder = "Velg seksjon"
  [languages.en]
    languageCode = "en-US"
    languageName = "English"
    title = "SAMT-BU Docs"
    weight = 2
    [languages.en.params]
      navSwitcherLabel = "Content"
      navSwitcherPlaceholder = "Select section"

[markup.goldmark.renderer]
  unsafe = true

[params]
  editURL = "https://github.com/SAMT-X/samt-bu-docs/edit/main/content/"

[[params.navSwitcher]]
  id = "om"
  title = "Om SAMT-BU"
  url = "om/"
  icon = "fa-info-circle"

[[params.navSwitcher]]
  id = "behov"
  title = "Behov"
  url = "behov/"
  icon = "fa-lightbulb-o"

[[params.navSwitcher]]
  id = "pilotering"
  title = "Piloter"
  url = "pilotering/"
  icon = "fa-flask"

[[params.navSwitcher]]
  id = "styring"
  title = "Styring"
  url = "styring/"
  icon = "fa-gavel"

[[params.navSwitcher]]
  id = "arkitektur"
  title = "Arkitektur"
  url = "arkitektur/"
  icon = "fa-sitemap"

[[params.navSwitcher]]
  id = "prosjektleveranser"
  title = "Prosjektleveranser"
  url = "prosjektleveranser/"
  icon = "fa-briefcase"


[[params.navSwitcher]]
  id = "innsikt"
  title = "Felles innsikt"
  url = "innsikt/"
  icon = "fa-bar-chart"

[[params.navSwitcher]]
  id = "ekstern-markedsdialog"
  title = "Ekstern markedsdialog"
  url = "ekstern-markedsdialog/"
  icon = "fa-comments"

[[params.navSwitcher]]
  id = "utkast"
  title = "Utkast og innspill"
  url = "utkast/"
  icon = "fa-pencil"

[module]
  [[module.imports]]
    path = "github.com/SAMT-X/team-architecture"
    [[module.imports.mounts]]
      source = "content"
      target = "content/arkitektur/overordnet-arkitektur"

  [[module.imports]]
    path = "github.com/SAMT-X/samt-bu-drafts"
    [[module.imports.mounts]]
      source = "content"
      target = "content/utkast"


  [[module.imports]]
    path = "github.com/SAMT-X/team-semantics"
    [[module.imports.mounts]]
      source = "content"
      target = "content/arkitektur/informasjonsarkitektur"

  [[module.imports]]
    path = "github.com/SAMT-X/samt-bu-pilot-1"
    [[module.imports.mounts]]
      source = "content"
      target = "content/pilotering/pilot-1"

  [[module.imports]]
    path = "github.com/SAMT-X/samt-bu-pilot-2"
    [[module.imports.mounts]]
      source = "content"
      target = "content/pilotering/pilot-2"

  [[module.imports]]
    path = "github.com/SAMT-X/samt-bu-pilot-3"
    [[module.imports.mounts]]
      source = "content"
      target = "content/pilotering/pilot-3"

  [[module.imports]]
    path = "github.com/SAMT-X/samt-bu-pilot-4"
    [[module.imports.mounts]]
      source = "content"
      target = "content/pilotering/pilot-4"

  [[module.imports]]
    path = "github.com/SAMT-X/samt-bu-pilot-5"
    [[module.imports.mounts]]
      source = "content"
      target = "content/pilotering/pilot-5"

  [[module.imports]]
    path = "github.com/SAMT-X/samt-bu-pilot-6"
    [[module.imports.mounts]]
      source = "content"
      target = "content/pilotering/pilot-6"

  [[module.imports]]
    path = "github.com/SAMT-X/samt-bu-pilot-7"
    [[module.imports.mounts]]
      source = "content"
      target = "content/pilotering/pilot-7"

  [[module.imports]]
    path = "github.com/SAMT-X/content-legal"
    [[module.imports.mounts]]
      source = "content"
      target = "content/arkitektur/juss"

  [[module.imports]]
    path = "github.com/SAMT-X/solution-samt-bu-docs"
    [[module.imports.mounts]]
      source = "content"
      target = "content/prosjektleveranser/loesninger/samhandlingsplattform/samt-bu-docs"

  [[module.imports]]
    path = "github.com/SAMT-X/solution-task-management"
    [[module.imports.mounts]]
      source = "content"
      target = "content/prosjektleveranser/loesninger/samhandlingsplattform/oppgavestyring"

  # Felles innsikt, flyttet fra lokal content/innsikt 2026-11-15, samme adresse (solution-samt-bu-docs#82)
  [[module.imports]]
    path = "github.com/SAMT-X/content-insight"
    [[module.imports.mounts]]
      source = "content"
      target = "content/innsikt"

  # Behov, flyttet fra lokal content/behov 2026-11-15, samme adresse (solution-samt-bu-docs#82)
  [[module.imports]]
    path = "github.com/SAMT-X/samt-bu-needs"
    [[module.imports.mounts]]
      source = "content"
      target = "content/behov"

  # Styring, flyttet fra content/prosjektstyring 2026-11-15 (solution-samt-bu-docs#82)
  [[module.imports]]
    path = "github.com/SAMT-X/samt-bu-governance"
    [[module.imports.mounts]]
      source = "content"
      target = "content/styring"

  [[module.imports]]
    path = "github.com/SAMT-X/samt-bu-market-engagement"
    [[module.imports.mounts]]
      source = "content"
      target = "content/ekstern-markedsdialog"
