name: Bygg og deploy til Cloudflare Pages

run-name: >-
  ${{ github.event_name == 'repository_dispatch' && format('{0} ({1})', github.event.client_payload.message || 'oppdatert', github.event.client_payload.source) || github.event.head_commit.message || 'Manuell kjøring' }}

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  repository_dispatch:
    types: [module-updated]

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.155.3
    steps:
      - name: Install Hugo CLI
        run: |
          for i in 1 2 3; do
            wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb && break
            echo "Attempt $i failed, retrying in $((i * 5)) seconds..."
            sleep $((i * 5))
          done
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Sikre UUID-er i frontmatter
        if: github.event_name == 'push'
        run: |
          python3 .github/scripts/ensure-uuids.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          if git diff --staged --quiet; then
            echo "Ingen endringer – alle UUID-er var på plass"
          else
            git commit -m "Auto: legg til manglende UUID-er i frontmatter [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push-forsøk $i feilet, prøver igjen..."
              sleep 3
            done
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Konfigurer git for UTF-8-stier
        run: git config --global core.quotepath false

      - name: Hent siste modulversjoner (inkl. lastmod injisert i modulrepoer)
        env:
          GONOSUMDB: "*"
          GOPROXY: "direct"
        run: |
          # Tre forsøk per modul – forbigående nettverksfeil skal ikke stoppe bygget (solution-samt-bu-docs#83)
          hent() {
            for i in 1 2 3; do
              hugo mod get "$1" && return 0
              echo "hugo mod get $1: forsøk $i feilet, prøver igjen om $((i * 5)) sek..."
              sleep $((i * 5))
            done
            return 1
          }
          hent github.com/SAMT-X/team-architecture@latest
          hent github.com/SAMT-X/team-semantics@latest
          hent github.com/SAMT-X/samt-bu-drafts@latest
          hent github.com/SAMT-X/solution-samt-bu-docs@latest
          hent github.com/SAMT-X/solution-task-management@latest
          hent github.com/SAMT-X/samt-bu-pilot-1@latest
          hent github.com/SAMT-X/samt-bu-pilot-2@latest
          hent github.com/SAMT-X/samt-bu-pilot-3@latest
          hent github.com/SAMT-X/samt-bu-pilot-4@latest
          hent github.com/SAMT-X/samt-bu-pilot-5@latest
          hent github.com/SAMT-X/samt-bu-pilot-6@latest
          hent github.com/SAMT-X/samt-bu-pilot-7@latest
          hent github.com/SAMT-X/samt-bu-market-engagement@latest
          hugo mod tidy

      # Feiler bygget på én innholdsfil, legges forrige publiserte versjon tilbake og
      # resten bygges (solution-samt-bu-docs#83)
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Europe/Oslo
          BUILD_FALLBACK_REPORT: ${{ runner.temp }}/set-aside.json
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/build-with-fallback.py \
            hugo \
            --gc \
            --minify \
            --baseURL "https://docs.samt-bu.no/"

      # Kvittering for nettleserens byggdeteksjon (solution-samt-bu-docs#77)
      - name: Skriv build.json
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILD_FALLBACK_REPORT: ${{ runner.temp }}/set-aside.json
        run: python3 .github/scripts/write-build-info.py

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          for i in 1 2 3; do
            npx wrangler pages deploy ./public --project-name samt-bu-docs --branch main && break
            echo "Deploy-forsøk $i feilet, prøver igjen om 15 sek..."
            sleep 15
          done

      # Kommentar på solution-samt-bu-docs#83 når filer ble satt til side. Krever secret
      # BUILD_REPORT_TOKEN (fine-grained, bare Issues: write på solution-samt-bu-docs).
      # Uten den står rapporten bare i jobbsammendraget og i build.json.
      # Én kommentar per fil, ikke per bygg: en skjult markør (repo:sti@commit) i
      # kommentaren gjør at samme sak ikke meldes igjen mens feilen står.
      - name: Meld fra om filer satt til side
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.BUILD_REPORT_TOKEN }}
          REPORT: ${{ runner.temp }}/set-aside.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -s "$REPORT" ] || [ "$(jq length "$REPORT")" = "0" ]; then
            echo "Ingen filer satt til side."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "BUILD_REPORT_TOKEN mangler – rapporten står i jobbsammendraget."
            exit 0
          fi
          gh api repos/samt-x/solution-samt-bu-docs/issues/83/comments --paginate --jq '.[].body' > earlier.txt
          jq -c '.[] | . + {marker: "<!-- set-aside \(.repo):\(.path)@\(.published_sha) -->"}' "$REPORT" > entries.jsonl
          : > new.jsonl
          while read -r entry; do
            grep -qF "$(jq -r .marker <<< "$entry")" earlier.txt || echo "$entry" >> new.jsonl
          done < entries.jsonl
          if [ ! -s new.jsonl ]; then
            echo "Alle filene er meldt fra om før."
            exit 0
          fi
          {
            echo "**Bygget feilet på en innholdsfil, men resten av nettstedet er publisert.** Fila under er erstattet med forrige publiserte versjon (eller holdt utenfor) til feilen er rettet. Den meldes ikke på nytt i senere bygg."
            echo
            jq -r '"- [\(.path)](https://github.com/SAMT-X/\(.repo)/blob/main/\(.path)) i `\(.repo)`: \(.action)\n  ```\n  \(.error)\n  ```\n  \(.marker)"' new.jsonl
            echo
            echo "Kjøring: $RUN_URL"
          } > body.md
          gh issue comment 83 --repo samt-x/solution-samt-bu-docs --body-file body.md
